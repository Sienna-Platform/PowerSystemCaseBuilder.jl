# RTS-GMLC column-to-field map used by PowerSystemCaseBuilder's RTS fixtures.
#
# Derived from the descriptor shipped inside the RTS-GMLC-0.2.3 artifact, plus 20 field
# mappings that descriptor omits. Without them PowerTableDataParser's emissions, outage, and
# geographic parsers read `nothing`, skip silently, and the data reaches the System nowhere --
# it survived only as unmapped extras on the OpenAPI document, which PowerSystems drops.
#
# Deliberately NOT copied from PowerTableDataParser's own test descriptor: that one maps shunts
# to `mw_shunt_g`/`mvar_shut_b` and coordinates to `lat`/`lng`, none of which are field names in
# `power_system_inputs.json`. Those mappings are dead there, which is why the RTS bus shunts
# never become FixedAdmittance components in its fixture. The artifact's `shunt_g`/`shunt_b` and
# `position` mappings are correct and are kept.
#
# Every added field name was verified against PowerTableDataParser's `power_system_inputs.json`.
